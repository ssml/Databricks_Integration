# BTO Job (LubeOil pipeline child job)
# Triggered only via run_job_task from resources/lubeoil_dashboard.job.yml.
# No standalone schedule - the source BTO Job's own unused cron (29 0 3/12 * * ?) is intentionally dropped.

resources:
  jobs:
    ALPHALINER:
      name: ALPHALINER
      description: >
        Talend Decomm-ALPHALINER

      tags:
        Project: Talend Decomm
        Team: Data_Ops
        env: ${var.env}

      email_notifications:
        on_failure:
          - ${var.notification_email}

      max_concurrent_runs: 1

      parameters:
        - name: env
          default: ${var.env}

      tasks:
        - task_key: DW_API_ALPHALINERVESSEL
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ..src/Databricks_Integration/Alphaliner/DW_API_ALPHALINERVESSEL.ipynb
            base_parameters:
              env: ${var.env}