bundle:
  name: databricks_integration
  uuid: 148d4119-f970-4d64-95c1-4bd8b28e752a

include:
  - resources/*.yml

variables:
  developer_name:
    description: GitHub username of the developer deploying this bundle
    default: seaspan-github-user
  developer_group:
    description: Databricks developer group permission.
    default: seaspan-developer-group
  admin_group:
    description: Databricks admin group permission.
    default: seaspan-admin-group

  env:
    description: Target environment name (dev, tst, prd) used by notebooks to derive catalog
    default: ${bundle.target}
  cluster_id:
    description: Existing environment-specific cluster ID
  job_pause_status:
    description: Whether scheduled jobs are paused (PAUSED or UNPAUSED)
    default: PAUSED
  notification_email:
    description: Email address to receive notifications for this bundle
    default: "ajobe@seaspancorp.com"
  apim_baseurl:
    description: Email address to receive notifications for this bundle
    default: ""

presets:
  tags:
    domain: ${var.domain_name}

targets:
  dev:
  default: true
    mode: development
    workspace:
      host: https://adb-2714653562668137.17.azuredatabricks.net
    variables:
      env: dev
      cluster_id: 0814-232803-5eblt1gz
      notification_email: ajobe@seaspancorp.com
      apim_baseurl: ${vars.apim_baseurl}
    permissions:
      - level: CAN_MANAGE
        group_name: ${var.admin_group}
      - level: CAN_RUN
        group_name: ${var.developer_group}


  tst:
    mode: production
    workspace:
      host: https://adb-2206726032770692.12.azuredatabricks.net
    variables:
      cluster_id: 1201-170321-zkw6msoj
      notification_email: ajobe@seaspancorp.com
      apim_baseurl: ${vars.apim_baseurl}
      job_pause_status: PAUSED
    permissions:
      - level: CAN_MANAGE
        group_name: ${var.admin_group}
      - level: CAN_RUN
        group_name: ${var.developer_group}
