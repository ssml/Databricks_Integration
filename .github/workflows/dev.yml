name: Validate Databricks Bundle

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add custom DNS Mapping
        run: |
          HOST_STRIPPED="${DATABRICKS_HOST#*://}"
          echo "${{ secrets.DATABRICKS_HOST_IP }} $HOST_STRIPPED" | sudo tee -a /etc/hosts

      - name: Azure Authentication
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.CLIENT_ID }}","clientSecret":"${{ secrets.CLIENT_SECRET }}","tenantId":"${{ secrets.TENANT_ID }}"}'
          allow-no-subscriptions: true

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Test Databricks Authentication
        run: databricks auth describe

      - name: Test Databricks Connection
        run: databricks current-user me

      - name: Validate Bundle
        run: databricks bundle validate -t dev

